name: test

# Read-only standalone CI: no publishing, deployment, provider, secret or write
# permission exists in this workflow. The deployment workflow is separate.
#
# Lanes:
#  * `linux` -- the DEFAULT (fast) pytest suite on the declared floor (3.11) and
#    on current stable CPython. pyproject.toml's default selection excludes the
#    single `integration` marker, so no leg here builds or installs a wheel,
#    drives the publisher's Git path or launches a generated page.
#  * `integration` -- every genuine wheel / CLI / browser-process / publication
#    case ONCE, on the Linux floor interpreter, with Node bound explicitly by
#    value. A Linux floor pass is NOT evidence for another interpreter, so the
#    current-version lane below keeps its own installed-consumer smoke.
#  * `linux-current-consumer` -- current stable CPython builds and installs the
#    wheel into ITS OWN isolated environment and runs tests/consumer_smoke.py
#    under that interpreter, so compatibility is measured rather than assumed.
#  * `node` -- the maintained browser code's own suites, once, from the reviewed
#    Node pin. Cross-runtime behaviour is the shared batch corpus in the
#    integration lane, not a second catalogue suite here.
#  * `windows` -- the narrow Windows installed-consumer smoke; the POSIX suite
#    stays Linux-only.
#
# Every lane that needs a tool binds it explicitly and fails when it is missing:
# no lane relies on a runtime inherited from the runner image.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: linux / python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Quoted on purpose: unquoted 3.10-style values are YAML floats.
        python-version: ["3.11", "3.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Current stable, or the declared floor. `allow-prereleases: false` keeps
      # a pre-release out of the range; `check-latest: true` asks for the newest
      # matching GA release instead of a stale cached one.
      - name: Set up the selected interpreter
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
          allow-prereleases: false

      - name: Prove the selected interpreter
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          test -x "$PYTHON"
          "$PYTHON" -VV
          "$PYTHON" -I -c 'import sys
          assert sys.implementation.name == "cpython", sys.implementation.name
          assert sys.version_info[:2] >= (3, 11), sys.version_info
          assert sys.version_info.releaselevel == "final", sys.version_info
          print("selected interpreter is final CPython:", sys.version)'

      # Collection imports the SDK (tests/test_mcp_protocol.py), so the reviewed
      # SDK pins are real prerequisites of the FAST suite too. Prepared OUTSIDE
      # pytest and pinned to the reviewed versions; no dependency caching.
      - name: Provision the reviewed fast-suite prerequisites
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
          PIP_CONFIG_FILE: /dev/null
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: |
          set -euo pipefail
          "$PYTHON" -m pip install \
            "pytest==9.1.1" \
            "mcp==2.3.0" \
            "pydantic==2.14.1" \
            "anyio==4.15.1"
          "$PYTHON" -m pytest --version
          "$PYTHON" -c 'import mcp, pydantic, anyio; print("SDK pins importable")'

      # Runner-owned HOME/TMPDIR keep the fast suite from writing into the
      # runner account or reading an account-specific cache.
      - name: Bind the runner-owned test environment
        env:
          TEST_HOME: ${{ runner.temp }}/test-home
          TEST_TMPDIR: ${{ runner.temp }}/test-tmp
        run: |
          set -euo pipefail
          mkdir -p "$TEST_HOME" "$TEST_TMPDIR"
          {
            echo "HOME=$TEST_HOME"
            echo "TMPDIR=$TEST_TMPDIR"
            echo "XDG_CACHE_HOME=$TEST_HOME/.cache"
          } >> "$GITHUB_ENV"

      # pyproject.toml's addopts select the fast suite. The integration marker,
      # its prerequisites and its single run live in the `integration` job below;
      # `-rs` keeps the intended operator skips visible with their reason.
      - name: Run the fast suite
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          "$PYTHON" -m pytest tests -q --strict-markers -rs

  # Every genuine wheel / CLI / browser-process / publication case, once. The
  # floor interpreter is installed explicitly and the generated-page and
  # cross-runtime cases get an explicitly bound Node major. Nothing is inferred
  # from PATH discovery for the tools this lane requires.
  integration:
    name: integration / linux python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the exact Node.js runtime
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          check-latest: true
          package-manager-cache: false

      - name: Set up the exact CPython 3.11 floor interpreter
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          check-latest: true
          allow-prereleases: false

      # Both runtimes are proven and written to GITHUB_ENV by VALUE. A
      # substituted runtime is a failure, not a differently-behaving green run.
      - name: Bind and prove both runtimes
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          test -x "$PYTHON"
          "$PYTHON" -VV
          "$PYTHON" -I -c 'import sys
          assert sys.implementation.name == "cpython", sys.implementation.name
          assert sys.version_info[:2] == (3, 11), sys.version_info
          assert sys.version_info.releaselevel == "final", sys.version_info
          print("floor is genuine CPython 3.11:", sys.version)'

          node_binary="$(command -v node)"
          test -x "$node_binary"
          "$node_binary" --version
          "$node_binary" -e 'const major = Number(process.versions.node.split(".")[0]);
          if (major !== 22) { throw new Error("unexpected Node major: " + process.versions.node); }
          console.log("node:", process.version, process.execPath);'

          {
            echo "FREE_INFERENCE_WATCHDOG_FLOOR_PYTHON=$PYTHON"
            echo "CONTRACT_NODE=$node_binary"
          } >> "$GITHUB_ENV"

      - name: Provision reviewed integration prerequisites
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
          PIP_CONFIG_FILE: /dev/null
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: |
          set -euo pipefail
          "$PYTHON" -m pip install \
            "pytest==9.1.1" \
            "setuptools==84.2.1" \
            "uv==0.13.5" \
            "mcp==2.3.0" \
            "pydantic==2.14.1" \
            "anyio==4.15.1"
          "$PYTHON" -m pytest --version
          "$PYTHON" -c 'import setuptools, mcp, pydantic, anyio; print("setuptools", setuptools.__version__)'

      # PyPI is used ONLY to provision this offline dependency source. The
      # native offline install below resolves from it, so no filename
      # precheck stands between the download and the real installation.
      - name: Download the CPython 3.11 dependency wheelhouse
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
          WHEELHOUSE: ${{ runner.temp }}/wheelhouse
          PIP_CONFIG_FILE: /dev/null
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: |
          set -euo pipefail
          mkdir -p "$WHEELHOUSE"
          "$PYTHON" -m pip download --only-binary=:all: --dest "$WHEELHOUSE" \
            --index-url https://pypi.org/simple \
            "mcp==2.3.0" "pydantic==2.14.1" "anyio==4.15.1"
          {
            echo "FREE_INFERENCE_WATCHDOG_WHEELHOUSE=$WHEELHOUSE"
          } >> "$GITHUB_ENV"

      # Runner-owned HOME/TMPDIR and absolute tool paths are bound by value, so
      # a later PATH change cannot substitute an account, a virtualenv or a
      # different uv.
      - name: Bind the runner-owned integration environment
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
          TEST_HOME: ${{ runner.temp }}/test-home
          TEST_TMPDIR: ${{ runner.temp }}/test-tmp
        run: |
          set -euo pipefail
          mkdir -p "$TEST_HOME" "$TEST_TMPDIR"
          scripts_dir="$("$PYTHON" -c 'import sysconfig; print(sysconfig.get_path("scripts"))')"
          uv="$scripts_dir/uv"
          test -x "$uv"
          uv_version="$("$uv" --version)"
          printf 'uv: %s -> %s\n' "$uv" "$uv_version"
          case "$uv_version" in
            "uv 0.13.5 "*) ;;
            *) echo "unexpected uv version: $uv_version" >&2; exit 1 ;;
          esac
          {
            echo "FREE_INFERENCE_WATCHDOG_BUILD_PYTHON=$PYTHON"
            echo "FREE_INFERENCE_WATCHDOG_SMOKE_PYTHON=$PYTHON"
            echo "FREE_INFERENCE_WATCHDOG_INSTALLED_PYTHON=$PYTHON"
            echo "FREE_INFERENCE_WATCHDOG_UV=$uv"
            echo "HOME=$TEST_HOME"
            echo "TMPDIR=$TEST_TMPDIR"
            echo "XDG_CACHE_HOME=$TEST_HOME/.cache"
            echo "UV_CACHE_DIR=$TEST_HOME/uv-cache"
          } >> "$GITHUB_ENV"

      - name: Show the bound integration environment
        run: |
          set -euo pipefail
          env | LC_ALL=C sort | grep -E \
            '^(FREE_INFERENCE_WATCHDOG_(FLOOR|INSTALLED|BUILD|SMOKE)_PYTHON|FREE_INFERENCE_WATCHDOG_(UV|WHEELHOUSE)|CONTRACT_NODE|HOME|TMPDIR|XDG_CACHE_HOME|UV_CACHE_DIR)='

      # `-o addopts=""` makes the selection explicit rather than relying on a
      # CLI `-m` overriding the configured default expression.
      - name: Run the integration cases once
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          "$PYTHON" -m pytest tests -q -o addopts="" -m integration \
            --strict-markers -rs

  # The current stable interpreter gets its OWN installed-consumer smoke: a
  # Linux floor pass is not evidence for another interpreter. The wheel is built
  # and installed by precisely this interpreter into a fresh environment, and
  # tests/consumer_smoke.py is told which minor it must prove.
  linux-current-consumer:
    name: linux / current installed-consumer smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the selected current interpreter
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.x"
          check-latest: true
          allow-prereleases: false

      # The selected minor is read from the interpreter itself and carried
      # explicitly; nothing here assumes 3.11.
      - name: Bind owned paths and prove the selected interpreter
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
          ROOT: ${{ runner.temp }}/current-consumer
        run: |
          set -euo pipefail
          test -x "$PYTHON"
          "$PYTHON" -VV
          "$PYTHON" -I -c 'import sys
          assert sys.implementation.name == "cpython", sys.implementation.name
          assert sys.version_info[:2] >= (3, 11), sys.version_info
          assert sys.version_info.releaselevel == "final", sys.version_info'
          minor="$("$PYTHON" -I -c 'import sys; print("%d.%d" % sys.version_info[:2])')"
          printf 'selected interpreter: %s\n' "$minor"
          mkdir -p "$ROOT/dist" "$ROOT/wheelhouse" "$ROOT/neutral" \
            "$ROOT/home" "$ROOT/tmp" "$ROOT/work"
          {
            echo "CURRENT_MINOR=$minor"
            echo "CONSUMER_ROOT=$ROOT"
            echo "HOME=$ROOT/home"
            echo "TMPDIR=$ROOT/tmp"
            echo "PIP_CONFIG_FILE=/dev/null"
            echo "PIP_DISABLE_PIP_VERSION_CHECK=1"
            echo "PIP_NO_INPUT=1"
          } >> "$GITHUB_ENV"

      - name: Build the wheel with the selected interpreter
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          "$PYTHON" -m pip install --no-cache-dir "setuptools==84.2.1"
          "$PYTHON" -c "import setuptools; print('setuptools', setuptools.__version__)"
          "$PYTHON" -m pip wheel --no-deps --no-build-isolation \
            --wheel-dir "$CONSUMER_ROOT/dist" "$GITHUB_WORKSPACE"
          mapfile -t wheels < <(
            find "$CONSUMER_ROOT/dist" -maxdepth 1 -name '*.whl' -type f)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "expected exactly one built wheel, found ${#wheels[@]}" >&2
            exit 1
          fi
          printf 'built wheel: %s\n' "${wheels[0]}"
          {
            echo "CONSUMER_WHEEL=${wheels[0]}"
          } >> "$GITHUB_ENV"

      # PyPI supplies this interpreter's native wheelhouse; the smoke itself
      # installs OFFLINE from it, and the installed pins are read back from the
      # environment with importlib.metadata.
      - name: Download the native dependency wheelhouse
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          "$PYTHON" -m pip download --no-cache-dir --only-binary=:all: \
            --dest "$CONSUMER_ROOT/wheelhouse" \
            --index-url https://pypi.org/simple \
            "mcp==2.3.0" "pydantic==2.14.1" "anyio==4.15.1"

      - name: Create the isolated environment and install offline
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          venv="$CONSUMER_ROOT/venv"
          "$PYTHON" -m venv --clear "$venv"
          grep -q 'include-system-site-packages = false' "$venv/pyvenv.cfg"
          venv_python="$venv/bin/python"
          console="$venv/bin/free-inference-watchdog-mcp"
          test -x "$venv_python"
          "$venv_python" -m pip install --no-cache-dir --no-index \
            --find-links "$CONSUMER_ROOT/wheelhouse" --only-binary=:all: \
            "$CONSUMER_WHEEL" "mcp==2.3.0" "pydantic==2.14.1" "anyio==4.15.1"
          test -x "$console"
          "$venv_python" -c "import sys, importlib.metadata as metadata
          expected = {'mcp': '2.3.0', 'pydantic': '2.14.1', 'anyio': '4.15.1'}
          versions = {name: metadata.version(name) for name in expected}
          assert versions == expected, versions
          assert sys.version_info[:2] == tuple(int(part) for part in '$CURRENT_MINOR'.split('.')), sys.version
          print('installed:', sys.version)
          print('dependencies:', versions)"
          {
            echo "CONSUMER_VENV_PYTHON=$venv_python"
            echo "CONSUMER_CONSOLE=$console"
          } >> "$GITHUB_ENV"

      - name: Run the installed-consumer smoke on this interpreter
        run: |
          set -euo pipefail
          cd "$CONSUMER_ROOT/neutral"
          "$CONSUMER_VENV_PYTHON" -I "$GITHUB_WORKSPACE/tests/consumer_smoke.py" \
            --fixtures "$GITHUB_WORKSPACE/tests/fixtures/catalog" \
            --console "$CONSUMER_CONSOLE" \
            --work "$CONSUMER_ROOT/work" \
            --python-version "$CURRENT_MINOR"

  # Native JavaScript suites only, once. The cross-runtime shared corpus and the
  # generated-page execution live in the integration lane, so this job never
  # duplicates a catalogue suite.
  node:
    name: node / js suites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the exact Node.js runtime
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          check-latest: true
          package-manager-cache: false

      - name: Bind and prove the Node.js runtime
        run: |
          set -euo pipefail
          node_binary="$(command -v node)"
          test -x "$node_binary"
          "$node_binary" --version
          "$node_binary" -e 'const major = Number(process.versions.node.split(".")[0]);
          if (major !== 22) { throw new Error("unexpected Node major: " + process.versions.node); }
          console.log("node:", process.version, process.execPath);'
          {
            echo "CONTRACT_NODE=$node_binary"
          } >> "$GITHUB_ENV"

      - name: Run the browser code's own suites
        run: |
          set -euo pipefail
          test -x "$CONTRACT_NODE"
          "$CONTRACT_NODE" --test tests/js/catalog-query.test.cjs tests/js/webmcp.test.cjs

  # The narrow Windows installed-consumer smoke. It proves the installed wheel
  # and its installer-generated console on a Windows runner; it deliberately
  # does NOT run the POSIX suite (that stays the Linux lanes' authority). Every
  # path below is runner-owned, every native exit code is checked explicitly,
  # and there is no continue-on-error or skip.
  windows:
    name: windows / python 3.11 installed consumer
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the exact CPython 3.11 floor interpreter
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          check-latest: true
          allow-prereleases: false

      # Runner-owned HOME/USERPROFILE/cache/temp plus a work directory whose
      # name contains a space and a non-ASCII character. The smoke copies its
      # own fixture into paths derived from this one, so Windows path handling
      # is exercised rather than assumed.
      - name: Bind owned paths and prove the interpreter
        env:
          PYTHON_PATH: ${{ steps.python.outputs.python-path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $python = $env:PYTHON_PATH
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) {
            throw "setup-python reported no interpreter: $python"
          }
          & $python -VV
          if ($LASTEXITCODE -ne 0) { throw "interpreter -VV failed" }
          & $python -c "import sys; assert sys.implementation.name == 'cpython'; assert sys.version_info[:2] == (3, 11); assert sys.version_info.releaselevel == 'final'; print('floor:', sys.version)"
          if ($LASTEXITCODE -ne 0) { throw "the floor is not final CPython 3.11" }

          $root = Join-Path $env:RUNNER_TEMP 'consumer-smoke'
          $homeDir = Join-Path $root 'home'
          $tempDir = Join-Path $root 'tmp'
          $localAppData = Join-Path $homeDir 'AppData\Local'
          $neutral = Join-Path $root 'neutral'
          $work = Join-Path $root ('work space ' + [char]0x00e9)
          foreach ($directory in @($root, $homeDir, $tempDir, $localAppData, $neutral, $work)) {
            New-Item -ItemType Directory -Force -Path $directory | Out-Null
          }
          if ((Get-ChildItem -LiteralPath $work -Force | Measure-Object).Count -ne 0) {
            throw "the smoke work directory is not empty: $work"
          }

          @(
            "CONSUMER_SMOKE_PYTHON=$python"
            "CONSUMER_SMOKE_ROOT=$root"
            "CONSUMER_SMOKE_NEUTRAL=$neutral"
            "CONSUMER_SMOKE_WORK=$work"
            "HOME=$homeDir"
            "USERPROFILE=$homeDir"
            "LOCALAPPDATA=$localAppData"
            "TEMP=$tempDir"
            "TMP=$tempDir"
            "PIP_DISABLE_PIP_VERSION_CHECK=1"
            "PIP_NO_INPUT=1"
          ) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Reviewed build prerequisites live OUTSIDE the isolated environment; the
      # wheel is built with the declared backend and no build isolation. Its
      # dependencies are never resolved here.
      - name: Provision reviewed build prerequisites and build the wheel
        run: |
          $ErrorActionPreference = 'Stop'
          $python = $env:CONSUMER_SMOKE_PYTHON
          $root = $env:CONSUMER_SMOKE_ROOT
          & $python -m pip install --no-cache-dir "setuptools==84.2.1"
          if ($LASTEXITCODE -ne 0) { throw "setuptools provisioning failed" }
          & $python -c "import setuptools; print('setuptools', setuptools.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "setuptools import failed" }

          $dist = Join-Path $root 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          & $python -m pip wheel --no-deps --no-build-isolation --wheel-dir $dist $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw "wheel build failed" }

          $wheels = @(Get-ChildItem -LiteralPath $dist -Filter 'free_inference_watchdog_mcp-*.whl')
          if ($wheels.Count -ne 1) {
            throw "expected exactly one built wheel, found $($wheels.Count)"
          }
          $wheel = $wheels[0].FullName
          if ([System.IO.Path]::GetExtension($wheel) -ne '.whl') {
            throw "the build did not produce a wheel: $wheel"
          }
          Write-Host "built wheel: $wheel"
          "CONSUMER_SMOKE_WHEEL=$wheel" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # PyPI is used only for provisioning this native-platform wheelhouse. The
      # isolated environment is installed from it OFFLINE, so the smoke itself
      # cannot acquire anything: the native install resolves the explicit pins,
      # and the installed versions are read back with importlib.metadata.
      - name: Download the native dependency wheelhouse
        run: |
          $ErrorActionPreference = 'Stop'
          $python = $env:CONSUMER_SMOKE_PYTHON
          $wheelhouse = Join-Path $env:CONSUMER_SMOKE_ROOT 'wheelhouse'
          New-Item -ItemType Directory -Force -Path $wheelhouse | Out-Null
          & $python -m pip download --no-cache-dir --only-binary=:all: --dest $wheelhouse --index-url https://pypi.org/simple "mcp==2.3.0" "pydantic==2.14.1" "anyio==4.15.1"
          if ($LASTEXITCODE -ne 0) { throw "dependency download failed" }

          "CONSUMER_SMOKE_WHEELHOUSE=$wheelhouse" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # A FRESH PEP 405 environment under runner temp, no system site-packages,
      # installed OFFLINE from the native wheelhouse plus the built wheel.
      - name: Create the isolated environment and install offline
        run: |
          $ErrorActionPreference = 'Stop'
          $python = $env:CONSUMER_SMOKE_PYTHON
          $root = $env:CONSUMER_SMOKE_ROOT
          $venv = Join-Path $root 'venv'
          & $python -m venv --clear $venv
          if ($LASTEXITCODE -ne 0) { throw "venv creation failed" }

          $venvPython = Join-Path $venv 'Scripts\python.exe'
          $console = Join-Path $venv 'Scripts\free-inference-watchdog-mcp.exe'
          if (-not (Test-Path -LiteralPath $venvPython -PathType Leaf)) {
            throw "the isolated interpreter is missing: $venvPython"
          }
          $config = Get-Content -LiteralPath (Join-Path $venv 'pyvenv.cfg')
          if (-not ($config -match 'include-system-site-packages\s*=\s*false')) {
            throw "the isolated environment inherits system site-packages"
          }

          & $venvPython -m pip install --no-cache-dir --no-index --find-links $env:CONSUMER_SMOKE_WHEELHOUSE --only-binary=:all: $env:CONSUMER_SMOKE_WHEEL "mcp==2.3.0" "pydantic==2.14.1" "anyio==4.15.1"
          if ($LASTEXITCODE -ne 0) { throw "offline install failed" }
          if (-not (Test-Path -LiteralPath $console -PathType Leaf)) {
            throw "the installer did not create the console executable: $console"
          }

          & $venvPython -VV
          if ($LASTEXITCODE -ne 0) { throw "installed interpreter -VV failed" }
          & $venvPython -c "import sys, importlib.metadata as m; assert sys.version_info[:2] == (3, 11); assert sys.prefix != sys.base_prefix; versions = {name: m.version(name) for name in ('mcp', 'pydantic', 'anyio')}; assert versions == {'mcp': '2.3.0', 'pydantic': '2.14.1', 'anyio': '4.15.1'}, versions; print('installed:', sys.version); print('prefix:', sys.prefix); print('dependencies:', versions)"
          if ($LASTEXITCODE -ne 0) { throw "installed dependency identity is wrong" }

          @(
            "CONSUMER_SMOKE_VENV_PYTHON=$venvPython"
            "CONSUMER_SMOKE_CONSOLE=$console"
          ) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Neutral cwd outside the checkout, absolute script/fixture paths, an
      # empty owned work directory, the environment's own absolute Python, and
      # the exact minor this environment was created with.
      - name: Run the installed-consumer smoke
        run: |
          $ErrorActionPreference = 'Stop'
          $smoke = Join-Path $env:GITHUB_WORKSPACE 'tests\consumer_smoke.py'
          $fixtures = Join-Path $env:GITHUB_WORKSPACE 'tests\fixtures\catalog'
          foreach ($required in @($smoke, $fixtures)) {
            if (-not (Test-Path -LiteralPath $required)) {
              throw "missing smoke input: $required"
            }
          }
          if (-not (Test-Path -LiteralPath $env:CONSUMER_SMOKE_NEUTRAL -PathType Container)) {
            throw "missing neutral working directory: $env:CONSUMER_SMOKE_NEUTRAL"
          }
          Push-Location $env:CONSUMER_SMOKE_NEUTRAL
          try {
            & $env:CONSUMER_SMOKE_VENV_PYTHON -I $smoke --fixtures $fixtures --console $env:CONSUMER_SMOKE_CONSOLE --work $env:CONSUMER_SMOKE_WORK --python-version 3.11
            if ($LASTEXITCODE -ne 0) { throw "the installed-consumer smoke failed" }
          }
          finally {
            Pop-Location
          }

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "free-inference-watchdog-mcp"
version = "0.2.0"
description = "Read-only MCP server and pure query core over the published free-inference model catalogue."
readme = "README.md"
requires-python = ">=3.11"
license = "ISC"
license-files = ["LICENSE"]
dependencies = ["mcp>=2,<3"]

[project.scripts]
free-inference-watchdog-mcp = "watchdog_catalog.__main__:main"
free-inference-watchdog = "watchdog_catalog.cli:main"

# The wheel carries exactly one package and its reviewed tool-contract
# resource. Producer scripts, provider/state/cron/site/assets/tests and
# credentials stay out: explicit selection, no flat-layout auto-discovery and
# no include-package-data scan.
[tool.setuptools]
packages = ["watchdog_catalog"]
py-modules = []
include-package-data = false

[tool.setuptools.package-data]
watchdog_catalog = ["tools.json"]

# The DEFAULT run is the fast suite: genuine wheel/CLI/browser-process/
# publication cases are selected by the single `integration` marker and run
# once in CI, so a plain `pytest` never builds a wheel, drives the publisher's
# Git path or launches a generated page. Explicit commands:
#
#   python3 -m pytest tests/ -q                     fast suite (default)
#   python3 -m pytest tests/ -q -m integration      integration cases only
#   python3 -m pytest -o addopts='' tests/ -q       explicit full run
#
# Marker ownership is declarative in tests/conftest.py (module/test ids), never
# inferred from source shape.
[tool.pytest.ini_options]
addopts = '-m "not integration"'
markers = [
    "integration: genuine wheel/CLI/browser-process/publication case; runs once in CI",
]
